kind = "web"
previewPath = "/"
title = "QA Blog - Johnatan Milrad"
version = "1.0.0"
id = "artifacts/qa-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23687

[services.development]
run = "pnpm --filter @workspace/qa-blog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qa-blog", "run", "build" ]
publicDir = "artifacts/qa-blog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23687"
BASE_PATH = "/"
